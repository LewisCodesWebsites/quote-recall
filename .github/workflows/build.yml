name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project QuoteRecall.xcodeproj \
            -target QuoteRecall \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/QuoteRecall.app Payload/
          zip -qry QuoteRecall.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuoteRecall-ipa
          path: QuoteRecall.ipa

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest QuoteRecall.ipa --title "Latest build" --notes "Built from ${GITHUB_SHA}"
